# ==============================================================================
# Nodal: Local PostgreSQL + pgvector Fallback
# Note: Nodal uses Supabase PostgreSQL by default. This Docker setup is
# provided only as an optional offline development fallback.
# ==============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nodal-postgres
    restart: always
    environment:
      POSTGRES_DB: codegraph
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
